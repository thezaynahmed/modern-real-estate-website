<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Curated Estates — Platform Architecture</title>
  <desc id="desc">Curated Estates luxury real estate and mortgage platform built with Next.js 16, GSAP ScrollTrigger, and Tailwind CSS.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#17181c"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#E5C788"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141518" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="380" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" rx="20" fill="url(#grid-pattern)"/>
  <rect width="1198" height="378" x="1" y="1" rx="19" fill="none" stroke="rgba(197, 160, 89, 0.3)" stroke-width="1.5"/>

  <!-- Left: Brand & Editorial Hierarchy -->
  <g id="brand-block" transform="translate(64, 48)">
    <!-- Category Pill -->
    <rect width="260" height="28" rx="14" fill="rgba(197, 160, 89, 0.12)" stroke="rgba(197, 160, 89, 0.35)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#C5A059"/>
    <text x="30" y="18" fill="#E5C788" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">EDITORIAL WEB ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="86" fill="#F5F5F7" font-family="Georgia, serif" font-size="46" font-weight="normal" letter-spacing="-0.5">
      Curated <tspan fill="url(#gold-grad)" font-style="italic">Estates</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="126" fill="#8E929E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Integrated property acquisition &amp; mortgage advisory platform for the GTA.
    </text>
    <text x="0" y="150" fill="#8E929E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Engineered with Next.js 16 App Router, GSAP ScrollTrigger, and Lenis.
    </text>

    <!-- Accent Drafting Rule -->
    <line x1="0" y1="184" x2="520" y2="184" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="184" x2="80" y2="184" stroke="#C5A059" stroke-width="2"/>

    <!-- Key Metrics / Proof Points -->
    <g transform="translate(0, 208)">
      <g transform="translate(0, 0)">
        <text x="0" y="24" fill="#F5F5F7" font-family="Georgia, serif" font-size="28" font-weight="bold">695ms</text>
        <text x="0" y="44" fill="#8E929E" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1">TURBOPACK BUILD</text>
      </g>
      <g transform="translate(160, 0)">
        <text x="0" y="24" fill="#F5F5F7" font-family="Georgia, serif" font-size="28" font-weight="bold">60fps</text>
        <text x="0" y="44" fill="#8E929E" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1">SCROLL REVEALS</text>
      </g>
      <g transform="translate(320, 0)">
        <text x="0" y="24" fill="#F5F5F7" font-family="Georgia, serif" font-size="28" font-weight="bold">0 Err</text>
        <text x="0" y="44" fill="#8E929E" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1">STATIC GENERATION</text>
      </g>
    </g>
  </g>

  <!-- Right: Technical Architecture Blueprint Specimen -->
  <g id="specimen-card" transform="translate(680, 40)">
    <rect width="456" height="300" rx="14" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>

    <!-- Header bar -->
    <rect width="456" height="42" rx="14" fill="rgba(255, 255, 255, 0.03)"/>
    <rect width="456" height="1" y="42" fill="rgba(255, 255, 255, 0.08)"/>

    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="42" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    <text x="84" y="25" fill="#8E929E" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.5">curatedestates.zainahmed.net</text>

    <!-- Blueprint Stack Rows -->
    <g transform="translate(24, 62)">
      <!-- Layer 1 -->
      <g transform="translate(0, 0)">
        <rect width="408" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="16" y="26" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Framework Layer</text>
        <text x="392" y="26" fill="#C5A059" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="end">Next.js 16.4 &#8226; React 19.3</text>
      </g>

      <!-- Layer 2 -->
      <g transform="translate(0, 52)">
        <rect width="408" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="16" y="26" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Motion &amp; Virtual Scroll</text>
        <text x="392" y="26" fill="#C5A059" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="end">GSAP 3.15 &#8226; Lenis 1.3</text>
      </g>

      <!-- Layer 3 -->
      <g transform="translate(0, 104)">
        <rect width="408" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="16" y="26" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Styling &amp; Tokens</text>
        <text x="392" y="26" fill="#C5A059" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="end">Tailwind CSS v4 &#8226; OKLCH</text>
      </g>

      <!-- Layer 4 -->
      <g transform="translate(0, 156)">
        <rect width="408" height="42" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="16" y="26" fill="#F5F5F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Validation &amp; Schema</text>
        <text x="392" y="26" fill="#C5A059" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="end">Zod 4.6 &#8226; Hook Form 7.91</text>
      </g>
    </g>

    <!-- Footer Status -->
    <g transform="translate(24, 276)">
      <circle cx="6" cy="-2" r="3" fill="#10B981"/>
      <text x="16" y="2" fill="#8E929E" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5">DEPLOYED &#8226; MANAGED DNS &#8226; TORONTO, ON</text>
    </g>
  </g>
</svg>
